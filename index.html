const wordsA = words.filter(w => w.n <= 139);
const wordsB = words.filter(w => w.n >= 140);

document.getElementById('countA').textContent = wordsA.length;
document.getElementById('countB').textContent = wordsB.length;
document.getElementById('totalCount').textContent = words.length;

let currentWord = null;
let currentTab = 'A';

function makeCard(w) {
  return `<div class="word-card" id="card-${w.n}" onclick="selectWord(${w.n})">
    <div class="num">#${w.n}</div>
    <div class="ic">${w.i}</div>
    <div class="en">${w.w}</div>
    <div class="cn">${w.m}</div>
  </div>`;
}

document.getElementById('secA').innerHTML = `<div class="word-grid">${wordsA.map(makeCard).join('')}</div>`;
document.getElementById('secB').innerHTML = `<div class="word-grid">${wordsB.map(makeCard).join('')}</div>`;
document.getElementById('secAll').innerHTML = `<div class="word-grid">${words.map(makeCard).join('')}</div>`;

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (tab==='A'&&i===0)||(tab==='B'&&i===1)||(tab==='all'&&i===2));
  });
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  if(tab==='A') document.getElementById('secA').classList.add('active');
  else if(tab==='B') document.getElementById('secB').classList.add('active');
  else document.getElementById('secAll').classList.add('active');
  document.getElementById('searchInput').value = '';
}

function selectWord(n) {
  const w = words.find(x => x.n === n);
  if(!w) return;
  document.querySelectorAll('.word-card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll(`#card-${n}`).forEach(c => c.classList.add('active'));
  currentWord = w;
  document.getElementById('dpNum').textContent = '#' + w.n;
  document.getElementById('dpEn').textContent = w.w;
  document.getElementById('dpIc').textContent = w.i;
  document.getElementById('dpCn').textContent = w.m;
  document.getElementById('detailPanel').classList.remove('hidden');
  playWord(1);
}

function closeDetail() {
  document.getElementById('detailPanel').classList.add('hidden');
  document.querySelectorAll('.word-card').forEach(c => c.classList.remove('active'));
  currentWord = null;
}

function playWord(rate) {
  if(!currentWord) return;
  const wordToPlay = currentWord.w === 'AM' ? 'AM' : currentWord.w;
  const au = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(wordToPlay) + '&type=1');
  au.playbackRate = rate;
  au.play().catch(() => {
    if('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(wordToPlay);
      u.lang = 'en-US'; u.rate = rate; speechSynthesis.speak(u);
    }
  });
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q) {
    document.querySelectorAll('.word-card').forEach(c => c.style.display = '');
    return;
  }
  switchTab('all');
  setTimeout(() => {
    document.querySelectorAll('#secAll .word-card').forEach(c => {
      const en = c.querySelector('.en').textContent.toLowerCase();
      const cn = c.querySelector('.cn').textContent.toLowerCase();
      c.style.display = (en.includes(q) || cn.includes(q)) ? '' : 'none';
    });
  }, 50);
}
</script>
